name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - deployment.yaml
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke test container health endpoint
        run: |
          docker build --tag gitops-demo:test .
          docker run --detach --name gitops-demo-test --publish 127.0.0.1:8080:80 gitops-demo:test
          cleanup() {
            docker rm --force gitops-demo-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs gitops-demo-test
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            sanju9067/gitops-demo:latest
            sanju9067/gitops-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment image for Argo CD
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|image: sanju9067/gitops-demo:.*|image: sanju9067/gitops-demo:${IMAGE_TAG}|" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- deployment.yaml; then
            git add deployment.yaml
            git commit -m "chore: deploy image ${IMAGE_TAG}"
            git push
          fi
